<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Zippy | Pooja Project</title>
  
  <!-- Online Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons & FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Custom Figma Lush Forest Palette Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: var(--lush-bg);">

  <!-- Minimal Header -->
  <header class="bg-white border-bottom py-3 shadow-sm">
    <div class="container-xl d-flex align-items-center justify-content-between">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box">
          <i class="fa-solid fa-utensils"></i>
        </div>
        <span class="brand-name">zippy<span class="brand-highlight">.</span></span>
        <span class="brand-badge">Lush</span>
      </a>
      <div>
        <span class="small text-muted me-2 d-none d-sm-inline">Already have an account?</span>
        <a href="login.html" class="btn btn-sm btn-outline-success rounded-pill px-3 fw-bold">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Auth Content Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 540px;">
      
      <!-- Card Header -->
      <div class="auth-header">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-white bg-opacity-25 mb-2">
          <i class="bi bi-person-plus-fill fs-3 text-mint"></i>
        </div>
        <h2 class="auth-title">Create Account</h2>
        <p class="small text-white-50 mb-0">Join Zippy Lush for lightning fast deliveries and gourmet offers</p>
      </div>

      <!-- Card Body -->
      <div class="auth-body">
        
        <form id="signupForm" onsubmit="handleSignupSubmit(event)">
          
          <!-- Full Name -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-pine">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
              <input type="text" id="regName" class="form-control border-start-0" placeholder="e.g. Pooja JP" required>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <!-- Email -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-pine">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="regEmail" class="form-control border-start-0" placeholder="name@example.com" required>
              </div>
            </div>
            <!-- Phone -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-pine">Mobile Number</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted">+91</span>
                <input type="tel" id="regPhone" class="form-control border-start-0" placeholder="98765 43210" pattern="[0-9]{10}" required>
              </div>
            </div>
          </div>

          <!-- Delivery Address -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-pine">Primary Delivery Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
              <input type="text" id="regAddress" class="form-control border-start-0" placeholder="Flat / House No, Street, Indiranagar, Bengaluru" required>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <!-- Password -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-pine">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                <input type="password" id="regPassword" class="form-control border-start-0" placeholder="At least 6 chars" required minlength="6">
              </div>
            </div>
            <!-- Confirm Password -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-pine">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                <input type="password" id="regConfirmPassword" class="form-control border-start-0" placeholder="Confirm password" required minlength="6">
              </div>
            </div>
          </div>

          <!-- Terms Checkbox -->
          <div class="form-check mb-4">
            <input class="form-check-input cursor-pointer" type="checkbox" id="agreeTerms" required checked>
            <label class="form-check-label small text-muted cursor-pointer" for="agreeTerms">
              I agree to the <a href="#" class="text-success text-decoration-none fw-bold">Terms of Service</a> & <a href="#" class="text-success text-decoration-none fw-bold">Privacy Policy</a>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-auth-submit">
            <span>Create My Account</span>
            <i class="bi bi-arrow-right ms-2"></i>
          </button>

        </form>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-3 small text-muted border-top bg-white">
    © 2026 Zippy Clone • MCA Project MCSP-232 • Student: Pooja JP
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    function handleSignupSubmit(e) {
      e.preventDefault();
      const p1 = document.getElementById('regPassword').value;
      const p2 = document.getElementById('regConfirmPassword').value;
      
      if (p1 !== p2) {
        alert('Passwords do not match! Please check again.');
        return;
      }

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const phone = document.getElementById('regPhone').value;
      const address = document.getElementById('regAddress').value;

      localStorage.setItem('pooja_zippy_user', JSON.stringify({
        name,
        email,
        phone,
        address,
        role: 'customer'
      }));

      alert(`Account created successfully for ${name}! Redirecting to homepage...`);
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
